name: production check

# Once a day: the site's home page and the engine's /health must answer, and every finished engine
# wake must have ended in "slept: idle". Fails (so GitHub emails the owner) on any FLAG or when the
# site or /health is down. Public endpoints only; no secrets. /health never wakes the engine.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python scripts/v2/check_wakes.py --site https://archiveargues.org
