name: deploy

# Deploys only when asked: a manual run (choose the environment and what to deploy) or a pushed
# release tag (v2.*), which deploys both to production. Every deploy runs the tests and the release
# gates first. Credentials come from GitHub Actions secrets (CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID); the public site build settings from web/.env.staging and web/.env.release,
# and the engine origin from the API_ORIGIN repository variable. The engine's own secrets
# (ANTHROPIC_API_KEY, TURNSTILE_SECRET_KEY) are set once with `wrangler secret put` and are never
# handled here. See docs/SELF_HOSTING.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "staging or production"
        type: choice
        options: [staging, production]
        default: staging
      target:
        description: "what to deploy"
        type: choice
        options: [site, engine, both]
        default: both
  push:
    tags: ["v2.*"]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
  DEPLOY_TARGET: ${{ github.event.inputs.target || 'both' }}
  RELEASE_ID: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-run{1}', github.event.inputs.environment, github.run_number) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/v2/export_worker_config.py --check

  site:
    needs: test
    if: ${{ github.event.inputs.target != 'engine' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: build the web app in static mode
        # build settings are committed and public: web/.env.staging and web/.env.release
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build:${{ env.DEPLOY_ENV }}
      - name: assemble and gate the release
        run: |
          python scripts/v2/build_release.py assemble --release-id "$RELEASE_ID" --api-origin "${{ vars.API_ORIGIN }}"
          python scripts/v2/build_release.py gate
          rm -rf worker/site/release && cp -r build/release worker/site/release
      - name: deploy the site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          workingDirectory: worker/site
          command: deploy --env ${{ env.DEPLOY_ENV }} --message "release ${{ env.RELEASE_ID }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_ID }}
          path: build/release
          if-no-files-found: error

  engine:
    needs: test
    if: ${{ github.event.inputs.target != 'site' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/engine/package-lock.json
      - run: npm ci && npm run typecheck && npm test
        working-directory: worker/engine
      - name: apply the answer-cache migrations to D1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          workingDirectory: worker/engine
          command: d1 migrations apply DB --remote --env ${{ env.DEPLOY_ENV }}
      - name: deploy the engine Worker and its container image
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          workingDirectory: worker/engine
          command: deploy --env ${{ env.DEPLOY_ENV }} --var RELEASE_ID:${{ env.RELEASE_ID }}
