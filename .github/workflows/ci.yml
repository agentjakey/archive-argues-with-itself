name: ci

on: [push, pull_request]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Hermetic suite: stub embedder + stub LLM, temp databases, no network, no model
      # download. web/dist is present so the SPA fallback is exercised for real.
      - run: python -m pytest -q
      # Smoke: the real ASGI app served by uvicorn over a tiny fixture corpus, stub
      # embedder (CIVIC_EMBEDDER) and stub provider per request; no key, no network.
      - name: smoke test the served app
        env:
          CIVIC_DB_PATH: ${{ runner.temp }}/fixture/civic.db
          CIVIC_INDEX_PATH: ${{ runner.temp }}/fixture/vectors.db
          CIVIC_CACHE_PATH: ${{ runner.temp }}/fixture/answers.db
          CIVIC_EMBEDDER: stub
        run: |
          python scripts/make_fixture_db.py "$RUNNER_TEMP/fixture"
          python -m uvicorn archive_debugger.api.app:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          python scripts/smoke.py http://127.0.0.1:8000 || { cat "$RUNNER_TEMP/uvicorn.log"; exit 1; }
          kill %1

  engine-worker:
    # The engine Worker: typecheck, the shared cache-key vectors and the serving logic, and a check
    # that its generated config still matches what the engine's own code exports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/engine/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/v2/export_worker_config.py --check
      - run: npm ci
        working-directory: worker/engine
      - run: npm run typecheck
        working-directory: worker/engine
      - run: npm test
        working-directory: worker/engine

  e2e:
    # The static release as visitors meet it, at phone and laptop width, with the engine Worker
    # replaced by test routes: the engine off, a story, a recorded answer, a waking engine, and an
    # engine that stays down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build:e2e
        working-directory: web
      - run: python scripts/v2/build_release.py assemble --release-id e2e --api-origin https://engine.example.test
      - run: npm run e2e
        working-directory: web

  clean-clone:
    # Build from a fresh clone that contains only committed files, so a source file
    # that is tracked-but-missing (for example hidden by a stray .gitignore rule)
    # fails here before it reaches a deploy. This is what the web/src/lib case needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: clone the committed tree and build it
        run: |
          git clone --quiet . "$RUNNER_TEMP/clone"
          cd "$RUNNER_TEMP/clone/web"
          npm ci
          npm run build
          cd "$RUNNER_TEMP/clone"
          python -m pip install -e ".[dev]"
          python -m pytest -q
