# Read the worst pages again. The engine is chosen by measurement (docs/CLUSTER.md, "Choosing the
# OCR engine"); every candidate is openly licensed. The old text is always kept beside the new.
[job]
name = "ocr-sample"
kind = "ocr"
code_version = "1"

[input]
prefix = "jobs-input/ocr-sample"

[output]
prefix = "jobs"

[model]
name = "tesseract"
licence = "Apache-2.0"

[params]
engine = "tesseract"
image_suffix = ""
lexicon_key = "jobs-input/ocr-sample/lexicon.txt"

[executor.local]

[executor.k8s]
gpu = false
