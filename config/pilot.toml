# Pilot corpus configuration.
#
# The single chosen pilot, fixed after the Week 1 coverage audit. The pilot is
# fully reproducible from this file: topic term-set, collection clause, binning
# window, and floor.
#
# Finalist: public_health, chosen over the proposal's illustrative "housing"
# because it is the only candidate that clears the 2500-item floor within a clean
# Canadian-government scope (3,477 texts) without the microfiche-sourced microlog
# collection. See reports/coverage_audit/finalist_sizing.md.

[corpus]
topic = "public_health"
jurisdiction_scope = "Canada: federal + provincial + municipal (government issuers)"

# The public_health synonym term-set, copied verbatim from config/audit_candidates.toml.
# This exact string produced the 3,477 count. Do not re-derive it.
query = 'health OR "public health" OR healthcare OR hospital OR disease OR epidemic OR "medical care" OR sanitation OR "communicable disease" OR vaccination OR "health insurance"'
mediatype = "texts"

[corpus.window]
# Binning window only. This is used to bucket items by period for the timeline
# and coverage views. It is NOT a hard filter on the harvest: undated items are
# kept and routed to an undated bucket, and out-of-window items are kept too.
start_year = 1960
end_year = 2009
comparison_years = [1975, 1990, 2005]  # in-window; there is no 2025 in this archive

[corpus.collections]
# The clean Canadian-government clause discovered in Week 1. microlog and all
# scanner/library/format collections are excluded on purpose (scope + OCR quality).
# Adding the eight sibling collections to governmentpublications lifts the total
# only from 104,293 to 105,289 (near-total overlap), but they are kept for
# completeness of the government scope.
clean = [
    "governmentpublications",
    "albertagovernmentpublications",
    "uoftgovpubs",
    "ministryoffinance_ontario",
    "ocul_govinfocommunity",
    "hpl-govdocs",
    "canadianmunicipal",
    "ontarioeconomiccouncil",
    "taskforce_reports",
]
# Reserve lever only. Upside for corpus size, but microfiche-sourced with
# unverified OCR. Do not add without its own OCR spot-check.
reserve = ["microlog"]

[corpus.limits]
usable_floor = 2500  # minimum usable (has-OCR) items the pilot must retain

[harvest]
# Internet Archive automated-access etiquette.
user_agent_contact = ""              # set to a contact (email or URL) for the User-Agent
request_delay_seconds = 0.5
max_retries = 5
fields = "identifier,title,creator,publisher,date,year,collection,language,mediatype"
# Manifest paging uses advancedsearch.php, not the scrape API: the corpus is well
# under the 10k deep-paging window and the scrape endpoint throttles to a canned
# baseline. Per-item file lists and OCR come from the metadata API.
manifest_rows = 100
cache_dir = "raw"                    # not committed; see .gitignore

[index]
db_path = "civic.db"                 # local sqlite store; not committed
embedding_model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
embedding_dim = 384                   # dimensionality of the dense vectors

[retrieve]
index_path = "index/vectors.db"      # separate artifact, not committed, like raw/ocr/
embedder = "fastembed"               # tests/CI override to "stub"
batch_size = 256
candidates = 200                     # top-N per arm fed into RRF
rrf_k = 60
downweight_high = 1.0
downweight_medium = 0.9
downweight_low = 0.75
