# The audit panel (docs/formats/audit.md). Judges are named here; the pipeline code names none.
# The panel uses two judges from different model families; disagreements go to the escalation judge,
# then to the human queue. Candidates are judges run alongside the panel to choose the second judge
# by calibration (Phase 2 amendment 2); a candidate's verdicts never decide anything.

# The panel never includes the model that wrote the answers it judges (each collection's [v1]
# writer_model); the pipeline refuses a run that would. The v1 answers were written by Claude Haiku
# 4.5, so it can only be a candidate on them. This panel is provisional until the calibration labels
# choose one.

# Hard spending caps per phase, through the ledger (audit/budget.py). Entries carry the phase they
# were written in; entries from before that are Phase 2. Phase 2's cap covers the $5.75 spent before
# the close-out. Change `phase` when a phase starts.
[budget]
phase = "phase3"

[budget.caps]
phase2 = 60.00
phase3 = 120.00

[panel]
judges = ["claude-haiku-5-5", "gpt-oss-120b"]
escalation = "claude-sonnet-5-5"
candidates = ["claude-haiku-4-5"]   # kimi-k2.6 dropped after probe-1: eight times the cost, slow, a third of replies cut off

# Chosen 2026-11-01 against the silver labels (scripts/v2/choose_panel.py, reports/v2/audit/reference/
# panel_choice.md): no two-judge pair met the bar on SUPPORTS, so SUPPORTS uses Sonnet 5.5 as its second
# judge beside DeepSeek V4 Flash (two families), disagreements to a person. ANSWERS and IN SCOPE keep the
# default pair above and stay human-reviewed: nothing met the bar on them.
[panel.checks.supports]
judges = ["deepseek-v4-flash", "claude-sonnet-5-5"]
escalation = ""
review_share = 0.10      # the escalation judge re-reads this share of the agreed passes in every run
lenient_above = 0.10     # and flags a check when it does not pass more than this share of them

# Audit traffic to Workers AI goes through this AI Gateway (logs and caching on, a spend limit set in
# the dashboard). Audit items carry no visitor data. Anthropic calls go direct, so batches stay half price.
[gateway]
workers_ai = "archive-argues-audit"

[judges.claude-haiku-5-5]
provider = "anthropic"
model = "claude-haiku-5-5"
family = "anthropic"
batch = true
max_tokens = 3000        # thinking counts toward it
effort = "low"

[judges.claude-haiku-4-5]
provider = "anthropic"
model = "claude-haiku-4-5"
family = "anthropic"
batch = true
max_tokens = 800

[judges.claude-sonnet-5-5]
provider = "anthropic"
model = "claude-sonnet-5-5"
family = "anthropic"
batch = true
max_tokens = 3000
effort = "low"

[judges.gpt-oss-120b]
provider = "workers-ai"
model = "@cf/openai/gpt-oss-120b"
family = "openai"
max_tokens = 3000
reasoning_effort = "low"

[judges.deepseek-v4-flash]
provider = "workers-ai"
model = "@cf/deepseek-ai/deepseek-v4-flash-0731"
family = "deepseek"
max_tokens = 3000

[judges."kimi-k2.6"]
provider = "workers-ai"
model = "@cf/moonshotai/kimi-k2.6"
family = "moonshot"
max_tokens = 3000

# Reference judges (Phase 2 close-out): two strong models from different families, neither on the
# panel, that label the calibration kit and the benchmark approval sample with the author's guide,
# the full page text and reasoning allowed. Where they agree, that is the silver label
# (docs/formats/audit.md). They never decide a production verdict.
[reference]
judges = ["claude-fable-5-1", "deepseek-v4-pro"]

[judges.claude-fable-5-1]
provider = "anthropic"
model = "claude-fable-5-1"
family = "anthropic"
batch = true
max_tokens = 8000        # thinking is always on for this model and counts toward it
effort = "medium"
prompt = "reference"

[judges.deepseek-v4-pro]
provider = "workers-ai"
model = "@cf/deepseek-ai/deepseek-v4-pro-0813"
family = "deepseek"
max_tokens = 16000
reasoning_effort = "high"
prompt = "reference"
