[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-argues-with-itself"
version = "0.0.0"
description = "A civic memory debugger for Canada's public record: page-level provenance, temporal comparison, and visible archival uncertainty."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jacob Ortiz" }]

# Pins are intentional for reproducibility and were resolved together with pip
# on Python 3.11; the full resolved environment is recorded in requirements.lock.
dependencies = [
    "internetarchive==5.12.1",  # harvest: IA metadata + OCR derivative access
    "requests==2.34.2",         # harvest: raw HTTP where the IA client is not used
    "sqlite-vec==0.1.6",        # ingest/retrieve: vector index inside sqlite (inspectable, single file)
    "fastembed==0.9.1",         # ingest/retrieve: small ONNX embedding models, no torch
    "onnxruntime==1.19.2",      # retrieve: fastembed's runtime, pinned to the lock; with it the dense vectors
                                # match the existing indexes exactly (retrieve/embed.py, LEGACY_CLS_MODELS)
    "tokenizers==0.23.2",       # retrieve: fastembed's tokenizer, pinned to the lock for the same reason
    "numpy==2.4.6",             # retrieve: resident in-memory exact dense leg (A4); pinned to the lock
    "fastapi==0.133.0",         # api: read-only serve layer
    "uvicorn[standard]==0.34.0",# api: ASGI server
    "pydantic==2.13.5",         # generate: structured-output schema (explicit, was transitive)
    "anthropic==1.5.0",         # generate: the only permitted external LLM call (N1); stubbed in CI
    "python-dotenv==1.2.3",     # generate CLI only: loads .env (never overrides real env vars)
    "boto3>=1.34,<2",           # boot: stream each scope's DB files from Cloudflare R2 (archive_debugger.boot), S3-compatible
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",            # starlette TestClient transport (distinct from the SDK's httpx2)
]

[project.urls]
Homepage = "https://archiveargues.org"
Source = "https://github.com/agentjakey/archive-argues-with-itself"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
