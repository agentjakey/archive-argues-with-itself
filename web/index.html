<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e0c09" />
    <link rel="canonical" href="https://archiveargues.org/" />

    <title>Archive Argues With Itself: ask Canada's public-health record</title>

    <!-- Share / link-preview metadata. Copy is Jacob's to edit. The image at og-image.png
         is supplied separately (a clean attract screen or a non-flagged compare view); it is
         not generated here and must not point at a flagged or content-warned screenshot. -->
    <meta
      name="description"
      content="Ask Canada's public-health record in plain language. Answers cite the scanned government page they came from, say so when the record is silent, and every catalogue record of Internet Archive Canada's government publications is browsable. Open source."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Archive Argues With Itself" />
    <meta property="og:title" content="Archive Argues With Itself: public AI over Democracy's Library" />
    <meta
      property="og:description"
      content="Public AI over the Internet Archive's Democracy's Library. It reads the Canadian government's own public-health record, cites every answer to the scanned page, and refuses when the record is silent. Open source."
    />
    <meta property="og:url" content="https://archiveargues.org/" />
    <meta property="og:image" content="https://archiveargues.org/og-image.png" />
    <meta property="og:image:alt" content="Two scanned government pages from different decades, side by side, each with a page-level citation." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Archive Argues With Itself: public AI over Democracy's Library" />
    <meta
      name="twitter:description"
      content="Public AI over the Internet Archive's Democracy's Library. It reads the Canadian government's own public-health record, cites every answer to the scanned page, and refuses when the record is silent. Open source."
    />
    <meta name="twitter:image" content="https://archiveargues.org/og-image.png" />

    <!-- Sets html[data-theme] before the first paint (saved choice, else the device setting), so the
         page never flashes the wrong theme. A blocking file, not inline: the CSP allows no inline script. -->
    <script src="/theme-boot.js"></script>

    <!-- Critical inline styles (values copied from design/tokens.css and theme-light.css): paint the
         ground and the opening screen at once, in the right theme, before the bundle loads. No
         animation, so it is reduced-motion safe by construction. Tailwind takes over on mount. -->
    <style>
      html { background: #0e0c09; color: #e8dfc0; }
      html[data-theme="light"] { background: #f5efe1; color: #231c10; }
      @media (prefers-color-scheme: light) { html:not([data-theme]) { background: #f5efe1; color: #231c10; } }
      body {
        margin: 0;
        background: transparent;
        font-family: "Crimson Text", Georgia, "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }
      #app-static { max-width: 46rem; margin: 0 auto; padding: 18vh 16px 24px; text-align: center; }
      #app-static h1 {
        font-family: Cinzel, Georgia, serif; text-transform: uppercase; letter-spacing: 0.05em;
        font-weight: 600; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 0;
      }
      #app-static p { font-size: 18px; line-height: 1.5; opacity: 0.85; }
      #app-static a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount. Real words, not a placeholder, so the opening screen reads
           correctly before scripts run, to search engines and link previews too. -->
      <div id="app-static">
        <h1>Ask Canada's public-health record</h1>
        <p>
          Ask a question in plain language. Every answer cites the scanned government page it came from,
          and says so when the record cannot answer.
        </p>
        <p>
          <a href="/catalogue/">Browse the catalogue</a> &middot; <a href="/exhibit/">The exhibit</a> &middot;
          <a href="/?view=how">How it works</a>
        </p>
        <noscript><p>The question box needs JavaScript. The catalogue and the exhibit pages work without it.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
